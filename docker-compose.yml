services:
  db:
    image: pgvector/pgvector:pg16
    container_name: multimodal_pgvector_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multimodal_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multimodal_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

